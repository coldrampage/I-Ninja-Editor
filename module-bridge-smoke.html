<!doctype html>
<meta charset="utf-8">
<title>I-Ninja Editor ES-module API smoke test</title>
<div id="result">waiting</div>
<script type="module">
import * as Core from './js/vol-core.js';
import { EC } from './js/editor-core.js';
import { IA } from './js/strat-assembler.js';

const forbidden = ['parseVol', 'readWad', 'instances', 'EC', 'IA', 'Core'];
const checks = [
  ['core parser module', typeof Core.parseVol === 'function'],
  ['core WAD reader module', typeof Core.readWad === 'function'],
  ['editor-core copier API', typeof EC.copierSelfTest === 'function'],
  ['editor-core VOL rebuild API', typeof EC.rebuildVol === 'function'],
  ['assembler self-test API', typeof IA.selfTest === 'function'],
  ['assembler relinker API', typeof IA.relink === 'function'],
  ['no parser/editor/assembler globals', forbidden.every(name => !Object.prototype.hasOwnProperty.call(window, name))]
];
const failed = checks.filter(([, ok]) => !ok);
document.getElementById('result').textContent = checks.map(([name, ok]) => `${ok ? 'PASS' : 'FAIL'}: ${name}`).join('\n');
document.documentElement.dataset.smoke = failed.length ? 'fail' : 'pass';
if (failed.length) console.error('ES-module API smoke test failed:', failed);
else console.info('ES-module API smoke test passed.');
</script>
